name: llmke-entity-types
version: 1.1.0
source:
  document: M1-实体类型体系与归一化方案.docx
  sha256: 881f68c9996ecde7723d4d2c8fa9645da002b87cc340084419f1ed37340f7b95
  kind: SOURCE_TABLE_TRANSCRIBED
entity_types:
- code: PTY-REG
  name: 监管机构
  definition: 依法对金融机构实施监督管理的机关
  positive_examples: 国家金融监督管理总局、中国人民银行、中国证监会
  negative_examples: 中国工商银行（是被监管者）
  community_participation: 是
- code: PTY-TGT
  name: 被监管机构
  definition: 受监管的银行及非银行金融机构
  positive_examples: 商业银行、农村中小银行机构、外资银行、金融资产管理公司、银行卡清算机构
  negative_examples: 国家金融监督管理总局
  community_participation: 是
- code: PTY-PER
  name: 从业人员与责任人员
  definition: 机构从业人员及承担责任的个人
  positive_examples: 董事、监事、高级管理人员、直接责任人员
  negative_examples: 机构名称
  community_participation: 是
- code: PTY-CUS
  name: 客户与投资者
  definition: 金融业务的交易对手方
  positive_examples: 存款人、借款人、保单持有人、投资者
  negative_examples: 银行本身
  community_participation: 是
- code: PTY-OTH
  name: 其他主体
  definition: 为金融机构提供服务或承担专业职能的第三方
  positive_examples: 会计师事务所、第三方支付机构
  negative_examples: 监管机构
  community_participation: 是
- code: NOR-LAW
  name: 法律
  definition: 全国人大及其常委会制定的规范性文件
  positive_examples: 中国人民银行法、商业银行法、银行业监督管理法、保险法
  negative_examples: 外资银行管理条例（行政法规）
  community_participation: 是
- code: NOR-REG
  name: 行政法规
  definition: 国务院制定的规范性文件
  positive_examples: 外资银行管理条例
  negative_examples: 商业银行资本管理办法（部门规章）
  community_participation: 是
- code: NOR-RULE
  name: 部门规章
  definition: 金融监管部门制定的规章
  positive_examples: 商业银行资本管理办法、保险保障基金管理办法、农村中小银行机构行政许可事项实施办法
  negative_examples: 各类通知、公告
  community_participation: 是
- code: NOR-NORM
  name: 规范性文件
  definition: 通知、公告、指引、办法等非规章类规范性文件
  positive_examples: 关于…的通知、支付结算系统危机处置预案
  negative_examples: 商业银行法
  community_participation: 是
- code: NOR-CLAUSE
  name: 条款
  definition: 文件中的条款级引用
  positive_examples: 第一百条、第三条第二款
  negative_examples: 文件名
  community_participation: 是
- code: NOR-PEN
  name: 罚则
  definition: 违法行为对应的处罚措施
  positive_examples: 罚款、警告、责令改正、吊销许可证、市场禁入
  negative_examples: 合规要求（非处罚）
  community_participation: 是
- code: NOR-DEF
  name: 定义性条款
  definition: 文件中对术语作出界定的条款
  positive_examples: 本办法所称非银行金融机构包括…
  negative_examples: 具体行为要求
  community_participation: 是
- code: BIZ-PRD
  name: 业务品种
  definition: 金融机构经营的业务种类
  positive_examples: 存款、贷款、理财、银行卡清算、债券交易
  negative_examples: 业务流程环节
  community_participation: 是
- code: BIZ-LOAN
  name: 贷款类型
  definition: 信贷业务的细分品种
  positive_examples: 流动资金贷款、固定资产贷款、个人贷款、不良贷款
  negative_examples: 存款业务
  community_participation: 是
- code: BIZ-ACT
  name: 业务行为
  definition: 需要申请、审批、备案或报告的行为
  positive_examples: 设立、变更、终止、转让、展期、受托支付、报告、审批
  negative_examples: 静态业务品种
  community_participation: 是
- code: BIZ-CHN
  name: 业务环节
  definition: 业务流程中的阶段
  positive_examples: 贷前调查、贷时审查、贷后管理
  negative_examples: 监管指标
  community_participation: 是
- code: MEA-IDX
  name: 监管指标
  definition: 用于衡量机构审慎经营水平的指标
  positive_examples: 资本充足率、不良贷款率、授信集中度、杠杆率、流动性覆盖率
  negative_examples: 注册资本（属限额）
  community_participation: 是（权重下调）
- code: MEA-LIM
  name: 限额与比例
  definition: 制度规定的数量边界
  positive_examples: 单一客户贷款余额比例、注册资本最低限额
  negative_examples: 监管指标名称
  community_participation: 是（权重下调）
- code: MEA-AMT
  name: 金额
  definition: 具体金额数值
  positive_examples: 注册资本 10 亿元、罚款 50 万元
  negative_examples: 比例
  community_participation: 是（权重下调）
- code: MEA-TRM
  name: 期限
  definition: 制度规定的时限
  positive_examples: 贷款期限、整改期限、报告时限
  negative_examples: 频次
  community_participation: 是（权重下调）
- code: MEA-FRQ
  name: 频次
  definition: 制度规定的报告或检查频次
  positive_examples: 按月、按季、按年
  negative_examples: 具体日期
  community_participation: 是（权重下调）
- code: RSK-TYP
  name: 风险类别
  definition: 风险分类维度
  positive_examples: 信用风险、市场风险、操作风险、国别风险、流动性风险
  negative_examples: 风险事件
  community_participation: 是
- code: RSK-EVT
  name: 风险事件
  definition: 触发处置的特定情形
  positive_examples: 支付结算系统危机、被撤销、被宣告破产
  negative_examples: 风险类别
  community_participation: 是
- code: RSK-MSR
  name: 处置措施
  definition: 对风险事件采取的措施
  positive_examples: 接管、托管、撤销、破产清算、资产冻结
  negative_examples: 处罚措施（属 NOR-PEN）
  community_participation: 是
- code: CTX-TIM
  name: 时间
  definition: 时间点或时间段
  positive_examples: 2024 年、施行之日
  negative_examples: 期限（MEA-TRM）
  community_participation: 否
- code: CTX-GEO
  name: 地域与国家
  definition: 地理与国别信息
  positive_examples: 境外、中国香港、境内
  negative_examples: 机构名称
  community_participation: 否
- code: CTX-TAB
  name: 表格与附件
  definition: 文件内的表格、附表、附件
  positive_examples: 附表一、附件 2
  negative_examples: 正文条款
  community_participation: 否
identity:
  kb_scoped: true
  cross_type_merge: false
  regulation_key:
  - kb_id
  - type_code
  - authority_document_id
  - document_version
  - clause_number
  unknown_type: REVIEW_QUEUE_NOT_SILENT_FALLBACK
  legacy_7_type_mapping: REJECTED_NOT_USED
normalization:
  alias_source: M1 approved KB scoped alias table
  merge_trace:
  - alias
  - canonical
  - type_system_version
  - batch_id
  - method
  - approval_ref
gates:
  split_rate_max: 0.05
  merge_rate_max: 0.02
