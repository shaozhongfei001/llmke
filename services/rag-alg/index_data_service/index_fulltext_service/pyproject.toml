[project]
name = "index_fulltext_service_pactera"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "yuxj", email = "xinjian.yu1@pactera.com"},
]
dependencies = [
    "elasticsearch==8.13.2",
    "fastapi==0.111.0",
    "langchain==0.0.332",
    "langchain_elasticsearch==0.1.3",
    "pydantic==2.10.4",
    "uvicorn==0.30.1",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false
