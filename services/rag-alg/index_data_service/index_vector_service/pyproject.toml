[project]
name = "index_vector_service_pactera"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    { name = "yuxj", email = "xinjian.yu1@pactera.com" },
]
dependencies = [
    "fastapi==0.111.0",
    "langchain==0.0.332",
    "pydantic==2.10.4",
    "pymilvus==2.6.2",
    "uvicorn==0.30.1",
    "xinference"
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false
