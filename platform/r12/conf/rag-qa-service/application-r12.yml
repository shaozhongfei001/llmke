spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  application:
    name: rag-qa-service
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/gienrag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: ${R12_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: ${R12_REDIS_PASSWORD}
      database: 0
      timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
        namespace: public
        group: DEFAULT_GROUP
        register-enabled: true
      config:
        enabled: false
        import-check:
          enabled: false
  ai:
    gt:
      search-docs-url: http://127.0.0.1:19995/retrieval_documents
      llm-url: http://127.0.0.1:19996
      llm-chat-url: http://127.0.0.1:19996/llm_generate_sync
      llm-open-chat-url: http://127.0.0.1:19996/llm_open_chat
      llm-rotate-answer: http://127.0.0.1:19996/llm_rotate_answer
      llm-faq-select-url: http://127.0.0.1:19996/llm_faq_select
      llm-question-rewrite-url: http://127.0.0.1:19996/llm_question_rewrite
      audio-identify-url: http://127.0.0.1:19996/audio_identify
      request-length-limit: 20000
      select-model-names: ''
      retrieve-url: http://127.0.0.1:19995
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 1024MB
      file-size-threshold: 2MB
server:
  port: 18083
  servlet:
    context-path: /qa
  host-ip: 127.0.0.1
mybatis:
  table:
    auto: update
  model:
    pack: com.gientech.ragqaservice.domain.model
  database:
    type: mysql
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml,classpath*:com/gitee/sunchenbin/mybatis/actable/mapping/*/*.xml
  configuration:
    map-underscore-to-camel-case: true
aes:
  key: '1234567890123456'
  iv: '1234567890123456'
thread-pool:
  core-pool-size: 16
  max-pool-size: 64
  queue-capacity: 512
storage:
  default-platform: rag-qa
  default-storage-properties:
    end-point: http://127.0.0.1:19000
    domain: http://127.0.0.1:19000
    bucket-name: r12-rag
    access-key: r12minio
    secret-key: ${R12_MINIO_SECRET_KEY}
logging:
  level:
    root: INFO
minio:
  uri: http://127.0.0.1:19000
question:
  conf: '{}'
default:
  search-conf: '{}'
search:
  rerank: 'true'
  config-limit: ''
rocketmq:
  name-server: 127.0.0.1:19876
  producer:
    group: r12-producer
    send-message-timeout: 60000
