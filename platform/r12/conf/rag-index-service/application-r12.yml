spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  application:
    name: rag-index-service
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/gienrag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: ${R12_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: ${R12_REDIS_PASSWORD}
      database: 0
      timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
        ip: 127.0.0.1
        namespace: public
        group: DEFAULT_GROUP
        register-enabled: true
      config:
        enabled: false
        import-check:
          enabled: false
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 1024MB
      file-size-threshold: 2MB
server:
  port: 18082
  address: 127.0.0.1
  servlet:
    context-path: /index
  host-ip: 127.0.0.1
mybatis:
  table:
    auto: update
  model:
    pack: com.gientech.ragindexservice.domain.model
  database:
    type: mysql
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml,classpath*:com/gitee/sunchenbin/mybatis/actable/mapping/*/*.xml
  configuration:
    map-underscore-to-camel-case: true
aes:
  key: '1234567890123456'
  iv: '1234567890123456'
thread-pool:
  core-pool-size: 16
  max-pool-size: 64
  queue-capacity: 512
storage:
  default-platform: rag-qa
  default-storage-properties:
    end-point: http://127.0.0.1:19000
    domain: http://127.0.0.1:19000
    bucket-name: r12-rag
    access-key: r12minio
    secret-key: ${R12_MINIO_SECRET_KEY}
logging:
  level:
    root: INFO
remote:
  preview-stream:
    url: http://127.0.0.1:18095/stream
  py-milvus-url: http://127.0.0.1:19526
  py-es-url: http://127.0.0.1:19527
  file-parse:
    url: http://127.0.0.1:12340/parse
  file-parse-sync:
    url: http://127.0.0.1:12340/parse_sync
  del-index-file:
    url: http://127.0.0.1:19527/del_doc_by_col
  del-index:
