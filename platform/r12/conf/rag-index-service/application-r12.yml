    page-size: 50
  file:
    page-size: 50
  max-retry-times: 3
  migrate-size: 2000
  thread-pool:
    core-pool-size: 8
    maximum-pool-size: 32
    queue-capacity: 100
rocketmq:
  name-server: 127.0.0.1:19876
  producer:
    group: r12-producer
    send-message-timeout: 60000
jodconverter:
  local:
    office-home: /usr/lib/libreoffice
    port-numbers: 2002
file-parse:
  types: pdf,docx,xlsx,pptx,txt,md
  embedding-models: bge-m3
database:
