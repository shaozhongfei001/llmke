retry:
  max-retries: 3
  timeout: 30
  max-concurrent: 8
  worker-threads: 16
rest-template:
  connect-timeout: 1800000
  read-timeout: 1800000
milvus:
  host: 127.0.0.1
  port: 19630
model:
  types: '[{"value": "1", "label": "LLM大语言模型"}, {"value": "2", "label": "Embedding嵌入"}, {"value": "3", "label": "rerank排序"}, {"value": "4", "label": "MultiModel图片解析"}]'
  protocols: '[{"value": "1", "label": "Baichuan"}, {"value": "2", "label": "Qwen"}, {"value": "3", "label": "GLM"}, {"value": "4", "label": "openAI"}]'
kb:
  file-parse:
    task-nums: 5
    task-timeout: 3600
    retry-limit: 3
  faq-extract-model: 'qwen2.5-7b-instruct'
  faq-polish-model: ''
  faq-simiquestion-model: ''
  generate-graph-model: ''
file-convert:
