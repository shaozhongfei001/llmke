- id: P0-01
  title: 接口基线尚不能作为机器执行的唯一事实源
  status: OPEN
  owner: interface-owner
  decision_required:
  - 重跑 AST / 框架运行时路由提取，排除注释代码并校验处理函数绑定
  - 建立逐端点决议表，键为「服务身份 + 方法 + 原始大小写路径」
  - 裁定 /retrieval_qa 保留还是废弃（4.3 与 7.3 结论相反）
  - 说明 4.3 的 380 / 435 两个数字如何核算（380 + 新增 20 ≠ 435）
  known_facts:
  - GET /ai/getRerankModelInfos 的处理函数被记为 audioUploadAndIdentify，且该 @GetMapping 连同方法已被
    // 注释
  - 源码接口契约总表为 506 条，属清单记录数，不等于运行时可路由数
  - 两套入口并存：Java POST /ai/question、/ai/question_re 为 SSE 入口
  evidence_expectation:
  - 运行时路由—清单—目标契约三方差异归零报告
  - /retrieval_qa 保留或废弃的书面决议
  - 约 380 条「在用」判断的调用日志或调用方确认
  evidence: []
