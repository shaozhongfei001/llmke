# R12 授权范围修订记录（唯一一次、范围明确）
# 依据：业主 2026-10-25 R12 指令中「对于旧执行计划中'一项外部 P0 导致所有隔离开发停止'的规则，
#       依据本轮授权做一次范围明确的修订，记录改动与影响」。
# 本文件只记录"授权边界"的变更，不改变任何 P0 事实状态，不构成业务/安全/数据/独立 QA 的批准。
amendment_id: R12-SCOPE-AMEND
version: 1.0.0
effective: 2026-10-25
authorized_by: owner (R12 指令第三节)
recorded_by: tech-lead

previous_rule:
  source: docs/PROJECT-PLAN.yaml (L1..L4 required_blockers = P0-01..P0-04)
  effect: >
    任一 P0 未 CLOSED 时，全部实现类链路（L1-L4）保持 BLOCKED，
    隔离环境中的源码恢复、适配、集成与预生产验证事实上也被一并冻结。

changed_scope:
  what_changed: >
    新增受权范围 R12-real-rag：允许在隔离分支与环境（feature/R12-real-rag、
    独立端口段与独立容器）内进行源码恢复、技术适配、依赖安装、模型部署、
    集成测试与预生产试运行，不再因生产 P0 未关闭而停止。
  what_did_not_change:
    - P0-01..P0-04 的事实状态一律保持不变（仍然 OPEN，未 CLOSED）
    - make p0-gate 仍然失败（严格模式），不因本修订放行
    - 独立 QA 签署仍须受保护环境 + 外部密钥；开发角色不得代签
    - 生产发布、生产数据变更、安全批准仍需要真实证据与对应责任人
    - 不降低任何门禁的断言强度，不删除失败场景，不扩大忽略目录

impact:
  positive:
    - 主链（登录/建库/上传/解析/索引/检索/生成/引用）可在真实环境验证
    - 适配缺陷（DDL、编码、超时、降级）可在交付前暴露
  risk_and_control:
    - risk: 预生产可跑被误读为"生产可发布"
      control: 交付报告中「本轮功能验收 / 生产 P0 / 独立 QA / 生产发布」四态分列，禁止合并表述
    - risk: 隔离环境自签自批
      control: QA 角色只读且不得审签自己实现的内容；签署状态另行标注
    - risk: 用 Mock/降级换 PASS
      control: 关键链路（模型、检索、索引、解析）必须真实集成；降级必须在 ADAPTATIONS 与验收报告中显式登记

exit_conditions_for_r12:
  - 真实用户可完成本轮主链（浏览器可操作）
  - 五项资源（源码/离线依赖/真实模型/部署环境/部署制品）实际到位
  - 部署可复现（干净环境离线安装后复跑主链）
  - 上述三项同时成立才可结项；缺项按缺口如实登记，不得以"框架通过/资源待提供"结项
