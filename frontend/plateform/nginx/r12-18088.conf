# R12 前端生产部署（nginx，监听 18088）
# 依据：frontend/plateform/default.conf（原工程规则），仅把上游从内网 10.15.12.13:8888/9000
#      改为本机网关 127.0.0.1:8088 与 MinIO 127.0.0.1:19000；容器用 --network host 直接复用宿主 127.0.0.1。
# 不改 80 端口（被既有 WeKnora 占用）。
server {
    listen 18088;
    server_name localhost;
    client_max_body_size 50m;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # dist 挂载点（-v .../frontend/plateform/dist:/usr/share/nginx/html/rag:ro）
    root /usr/share/nginx/html/rag;
    index index.html index.htm;

    # SPA history fallback（原工程用 error_page 404 /index.html，此处等价实现）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端根（去掉 /proxy 前缀后打到网关根）
    location /proxy/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }
    location /cecProxy/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 网关根路径直连（无 rewrite）
    location /auth/ {
        proxy_pass http://127.0.0.1:8088/auth/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }
    location /index/ {
        proxy_pass http://127.0.0.1:8088/index/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }
    location /qa/ {
        proxy_pass http://127.0.0.1:8088/qa/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
        # SSE（/qa/ai/question、/qa/ai/question_re）逐条下发
        proxy_set_header X-Accel-Buffering no;
    }
    location /sensitive/ {
        proxy_pass http://127.0.0.1:8088/sensitive/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }
    location /graph/ {
        proxy_pass http://127.0.0.1:8088/graph/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }

    # MinIO 文件预览/下载
    location /minio/ {
        proxy_pass http://127.0.0.1:19000/;
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }
}
