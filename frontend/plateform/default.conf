server{
		listen	80;
		server_name localhost;
		client_max_body_size 50m;
		proxy_buffering off;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		location / {
			root /usr/share/nginx/html/rag;
			index index.html index.htm;
		}
		error_page 404	/index.html;
		location /proxy/ {
			proxy_pass http://10.15.12.13:8888/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
		location /ai/ {
			proxy_pass http://10.15.12.13:8888/qa/ai/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
        location /search/ {
			proxy_pass http://10.15.12.13:8888/qa/search/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
        location /dialogue/ {
			proxy_pass http://10.15.12.13:8888/qa/dialogue/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
        location /auth/ {
			proxy_pass http://10.15.12.13:8888/auth/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
        location /feedback/ {
			proxy_pass http://10.15.12.13:8888/qa/feedback/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
        location /cecProxy/ {
			proxy_pass http://10.15.12.13:8888/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
		location /minio/ {
			proxy_pass http://10.15.12.13:9000/;
			proxy_connect_timeout 180s;
			proxy_read_timeout 180s;
		}
}
